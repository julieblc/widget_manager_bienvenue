<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace RH — widget Grist</title>
<style>
  @font-face{
    font-family:"Marianne"; font-weight:400; font-style:normal; font-display:swap;
    src:url("https://cdn.jsdelivr.net/npm/@gouvfr-lasuite/ui-components@1.2.0/dist/assets/fonts/Marianne/Marianne-Regular.woff2") format("woff2");
  }
  @font-face{
    font-family:"Marianne"; font-weight:700; font-style:normal; font-display:swap;
    src:url("https://cdn.jsdelivr.net/npm/@gouvfr-lasuite/ui-components@1.2.0/dist/assets/fonts/Marianne/Marianne-Bold.woff2") format("woff2");
  }
  :root{
    --paper:#F6F6F6; --surface:#FFFFFF; --ink:#161616; --ink-muted:#666666; --ink-faint:#929292;
    --line:#DDDDDD; --line-strong:#CECECE;
    --blue:#000091; --blue-soft:#ECECFE; --blue-ink:#000091;
    --green:#18753C; --grey-soft:#EEEEEE;
    --radius-s:4px; --radius-m:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161616; --surface:#1E1E1E; --ink:#F6F6F6; --ink-muted:#B1B1B1; --ink-faint:#8A8980;
      --line:#3A3A3A; --line-strong:#454339;
      --blue:#8585F6; --blue-soft:#21213F; --blue-ink:#C6C6FE;
      --green:#27A658; --grey-soft:#2C2C2E;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font-family:"Marianne", arial, sans-serif; font-size:15px; line-height:1.5; }
  .shell{ max-width:1100px; margin:0 auto; padding:22px 22px 70px; }
  .topbar{ margin-bottom:16px; }
  .topbar .brand{ font-size:12px; color:var(--ink-faint); margin:0 0 5px; }
  .topbar h1{ font-weight:700; font-size:26px; margin:0; letter-spacing:-0.01em; }
  .topbar .sub{ color:var(--ink-muted); margin-top:5px; font-size:13.5px; }

  .search{ position:relative; margin-bottom:16px; }
  .search input{ width:100%; padding:9px 13px 9px 36px; border:1px solid var(--line-strong); border-radius:var(--radius-s); background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit; }
  .search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--ink-faint); }

  .state{ padding:40px 20px; text-align:center; color:var(--ink-muted); }
  .state strong{ display:block; color:var(--ink); font-size:15px; margin-bottom:6px; font-weight:600; }

  .svc-group{ border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); margin-bottom:12px; overflow:hidden; }
  .svc-group summary{ list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; gap:11px; user-select:none; }
  .svc-group summary::-webkit-details-marker{ display:none; }
  .svc-group summary .chev{ margin-left:auto; color:var(--ink-faint); transition:transform .15s ease; flex:none; }
  .svc-group[open] summary .chev{ transform:rotate(90deg); }
  .svc-badge{ width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff; flex:none; }
  .svc-group summary h2{ margin:0; font-size:14.5px; font-weight:700; }
  .svc-group summary .count{ font-size:11.5px; color:var(--ink-faint); background:var(--grey-soft); padding:3px 9px; border-radius:999px; font-weight:600; }

  table.roster{ width:100%; border-collapse:collapse; }
  table.roster th{ text-align:left; font-size:10.5px; color:var(--ink-faint); font-weight:600; padding:7px 16px; border-top:1px solid var(--line); background:var(--paper); }
  table.roster td{ padding:6px 16px; font-size:13.2px; border-top:1px solid var(--line); vertical-align:middle; }
  table.roster tr.empty-row td{ text-align:center; color:var(--ink-faint); padding:16px; }
  .cell-input{ width:100%; border:1px solid transparent; background:transparent; color:var(--ink); font-size:13.2px; font-family:inherit; padding:5px 6px; border-radius:var(--radius-s); }
  .cell-input:hover{ border-color:var(--line-strong); }
  .cell-input:focus{ border-color:var(--blue); outline:none; background:var(--surface); }
  select.cell-input{ cursor:pointer; }
  .prog-cell{ display:flex; align-items:center; gap:7px; min-width:120px; }
  .prog-track{ flex:1; height:6px; background:var(--grey-soft); border-radius:999px; overflow:hidden; }
  .prog-fill{ height:100%; border-radius:999px; background:var(--green); }
  .prog-pct{ font-size:11.5px; font-weight:700; color:var(--ink-muted); width:32px; text-align:right; flex:none; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:var(--radius-s); font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:20; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width: 700px){
    table.roster thead{ display:none; }
    table.roster, table.roster tbody, table.roster tr, table.roster td{ display:block; width:100%; }
    table.roster tr{ padding:10px 16px; border-top:1px solid var(--line); }
    table.roster td{ border-top:none; padding:2px 0; }
  }
</style>
</head>
<body>
<div class="shell">

  <div id="view-loading" class="state">
    <strong>Connexion au document…</strong>
    Autorisez l'accès complet si Grist vous le demande.
  </div>

  <div id="view-main" style="display:none">
    <div class="topbar">
      <p class="brand">Bienvenue à La Suite — espace RH</p>
      <h1>Agents par service</h1>
      <p class="sub" id="main-sub"></p>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Rechercher un nom ou un poste…" aria-label="Rechercher un agent">
    </div>

    <div id="groups"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }
  function loadGristScript(){
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://docs.getgrist.com/grist-plugin-api.js";
      s.onload = resolve;
      s.onerror = function(){ reject(new Error("grist-plugin-api.js indisponible")); };
      document.head.appendChild(s);
    });
  }
  function rowsFromTable(t){
    var ids = t.id, rows = [];
    for (var i=0;i<ids.length;i++){
      var row = { id: ids[i] };
      for (var col in t){ if (col !== "id") row[col] = t[col][i]; }
      rows.push(row);
    }
    return rows;
  }

  var SERVICES = [], MEMBERS = [], ITEMS = [], MC = [], TEMPLATES = [];
  var searchQuery = "";

  function templateItems(templateId){
    return ITEMS.filter(function(i){ return i.Template === templateId; });
  }
  function progressOf(member){
    var items = templateItems(member.Template);
    var rows = MC.filter(function(r){ return r.Member === member.id; });
    var custom = rows.filter(function(r){ return !r.Item && r.CustomLabel; });
    var total = items.length + custom.length;
    var done = items.filter(function(item){
      var row = rows.filter(function(r){ return r.Item === item.id; })[0];
      return row && row.Done;
    }).length + custom.filter(function(r){ return r.Done; }).length;
    return total ? Math.round(done/total*100) : 0;
  }

  async function loadAll(){
    var res = await Promise.all([
      grist.docApi.fetchTable("Services"),
      grist.docApi.fetchTable("Members"),
      grist.docApi.fetchTable("ChecklistItems"),
      grist.docApi.fetchTable("MemberChecklist"),
      grist.docApi.fetchTable("Templates")
    ]);
    SERVICES = rowsFromTable(res[0]);
    MEMBERS = rowsFromTable(res[1]);
    ITEMS = rowsFromTable(res[2]);
    MC = rowsFromTable(res[3]);
    TEMPLATES = rowsFromTable(res[4]);
  }

  async function saveField(memberId, field, value){
    try{
      await grist.docApi.applyUserActions([["UpdateRecord","Members", memberId, (function(){ var o={}; o[field]=value; return o; })()]]);
    }catch(err){
      toast("Échec de l'enregistrement — réessayez");
    }
  }

  function renderGroups(){
    var wrap = document.getElementById("groups");
    var q = searchQuery.trim().toLowerCase();
    document.getElementById("main-sub").textContent = MEMBERS.length + " agents au total, répartis sur " + SERVICES.length + " services";

    wrap.innerHTML = "";
    SERVICES.forEach(function(s){
      var members = MEMBERS.filter(function(m){ return m.Service === s.id; })
        .filter(function(m){ return !q || ((m.FirstName||"") + " " + (m.LastName||"") + " " + (m.Role||"")).toLowerCase().indexOf(q) > -1; })
        .sort(function(a,b){ return (a.LastName||"").localeCompare(b.LastName||"", "fr"); });
      if (q && !members.length) return;

      var group = document.createElement("details");
      group.className = "svc-group";
      group.open = true;

      var rowsHtml = members.length ? members.map(function(m){
        var pct = progressOf(m);
        var tplOptions = TEMPLATES.map(function(t){
          return '<option value="' + t.id + '"' + (t.id === m.Template ? " selected" : "") + '>' + t.Name + '</option>';
        }).join("");
        return '<tr data-member="' + m.id + '">' +
          '<td><input class="cell-input" data-field="LastName" value="' + (m.LastName||"") + '" placeholder="Nom"></td>' +
          '<td><input class="cell-input" data-field="FirstName" value="' + (m.FirstName||"") + '" placeholder="Prénom"></td>' +
          '<td><input class="cell-input" data-field="Email" value="' + (m.Email||"") + '" placeholder="Email"></td>' +
          '<td><input class="cell-input" data-field="Phone" value="' + (m.Phone||"") + '" placeholder="Téléphone"></td>' +
          '<td><select class="cell-input tpl-select">' + tplOptions + '</select></td>' +
          '<td><div class="prog-cell"><div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div><span class="prog-pct">' + pct + '%</span></div></td>' +
        '</tr>';
      }).join("") : '<tr class="empty-row"><td colspan="6">Aucun agent dans ce service.</td></tr>';

      group.innerHTML =
        '<summary>' +
          '<div class="svc-badge" style="background:' + s.Color + '">' + s.Initials + '</div>' +
          '<h2>' + s.Name + '</h2>' +
          '<span class="count">' + members.length + ' agent' + (members.length>1?'s':'') + '</span>' +
          '<svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>' +
        '</summary>' +
        '<table class="roster"><thead><tr><th>Nom</th><th>Prénom</th><th>Email</th><th>Téléphone</th><th>Template</th><th>Intégration</th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody></table>';

      group.querySelectorAll("tr[data-member]").forEach(function(tr){
        var memberId = Number(tr.getAttribute("data-member"));
        tr.querySelectorAll("input.cell-input").forEach(function(input){
          input.addEventListener("change", function(){
            saveField(memberId, input.getAttribute("data-field"), input.value.trim());
          });
        });
        var tplSelect = tr.querySelector(".tpl-select");
        tplSelect.addEventListener("change", async function(){
          tplSelect.disabled = true;
          await saveField(memberId, "Template", Number(tplSelect.value));
          await loadAll();
          renderGroups();
          toast("Template mis à jour");
        });
      });

      wrap.appendChild(group);
    });
  }
  document.getElementById("search-input").addEventListener("input", function(e){ searchQuery = e.target.value; renderGroups(); });

  async function init(){
    try{
      await loadGristScript();
      grist.ready({ requiredAccess: "full", name: "Espace RH" });
      await loadAll();
      document.getElementById("view-loading").style.display = "none";
      document.getElementById("view-main").style.display = "block";
      renderGroups();
    }catch(err){
      document.getElementById("view-loading").innerHTML =
        '<strong>Connexion impossible</strong>Vérifiez que ce widget a bien été ouvert depuis une page Grist, avec l\'accès complet au document autorisé.';
    }
  }
  init();

})();
</script>
</body>
</html>
